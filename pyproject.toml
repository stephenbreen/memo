[project]
name = "memo-cli"
version = "0.1.0"
description = "A CLI tool to manage shortcuts and help you memorize them."
authors = [{ name = "Stephen Breen" }]
license = "MIT"
readme = "README.md"
dependencies = [
    "typer",
    "rich",
    "tinydb",
    "pydantic",
]

[project.scripts]
memo = "memo_cli.main:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
